<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🛡️%3C/text%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a1f" />
  <meta name="robots" content="noindex" />
  <title>Conductor · El Rastro Más Débil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="orb big"></div>
  <main class="host">
    <form class="glass pin" id="pinForm">
      <p class="eyebrow">Panel del conductor</p>
      <h1 class="title" style="font-size:2rem">El rastro más <em>débil</em></h1>
      <input id="pinInput" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off" />
      <button class="btn" type="submit">Entrar</button>
      <p class="muted" id="pinErr" style="min-height:1.2em"></p>
    </form>

    <div id="panel" class="hidden" style="display:flex;flex-direction:column;gap:14px">
      <header>
        <div>
          <p class="eyebrow">Conductor · sala <span id="roomName"></span></p>
          <h1>El rastro más <span class="accent">débil</span></h1>
        </div>
        <span class="chip"><span class="dotlive"></span> <span id="onlineCount">0</span> conectados</span>
      </header>

      <!-- Juez: aparece cuando alguien presiona -->
      <section class="glass panel judge hidden" id="judge">
        <p class="eyebrow" style="color:#fde68a">Tiene la palabra</p>
        <p class="who" id="judgeName"></p>
        <div class="actions">
          <button class="btn ok" id="btnOk">✔ Correcto</button>
          <button class="btn bad" id="btnBad">✖ Incorrecto</button>
          <button class="btn ghost sm wide" id="btnReopen">Fue sin querer · reabrir sin castigo</button>
        </div>
      </section>

      <section class="glass panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <p class="eyebrow" id="qMeta">Sala de espera</p>
          <span class="chip" id="phaseChip">lobby</span>
        </div>
        <p class="q" id="qText">Cuando estén todos conectados, inicia el juego.</p>
        <p class="a hidden" id="qAns"></p>
        <p class="muted hidden" id="lockedInfo"></p>
        <div class="actions" id="flow"></div>
      </section>

      <section class="glass panel">
        <p class="eyebrow">Jugadores y puntos</p>
        <div class="plist" id="plist"></div>
      </section>

      <section class="glass panel">
        <p class="eyebrow">Enlaces</p>
        <div class="links">
          <a class="btn ghost sm" id="lnkScreen" target="_blank">Abrir proyector ↗</a>
          <a class="btn ghost sm" id="lnkPlayer" target="_blank">Vista de jugador ↗</a>
        </div>
        <p class="eyebrow" style="margin-top:6px">Zona de reinicio</p>
        <div class="danger">
          <button class="btn ghost sm" id="btnReset">Nueva partida (puntos a 0)</button>
          <button class="btn ghost sm" id="btnWipe">Vaciar sala</button>
        </div>
      </section>
    </div>
  </main>
  <div class="mode-badge hidden" id="modeBadge">Modo demo local</div>
  <script type="module" src="js/host.js"></script>
</body>
</html>
